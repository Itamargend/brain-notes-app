name: BrainNotes
options:
  bundleIdPrefix: com.itamargendelman
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  BrainNotesKit:
    path: ../Packages/BrainNotesKit
targets:
  BrainNotes:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Required-reason API declarations: see PrivacyInfo.xcprivacy.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: DemoFixtures
        type: folder
        buildPhase: resources
      - path: ../Fixtures/demo-brain
        type: folder
        buildPhase: resources
    dependencies:
      - package: BrainNotesKit
    settings:
      base:
        PRODUCT_NAME: BrainNotes
        PRODUCT_BUNDLE_IDENTIFIER: com.itamargendelman.brainnotes
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Brain Notes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
        # The App Sandbox is on for Release. A sandboxed, ad-hoc signed Debug build cannot host the in-app
        # tests ("test runner hung before establishing connection"), so Debug runs unsandboxed.
        CODE_SIGN_ENTITLEMENTS[config=Debug][sdk=macosx*]: BrainNotes.debug.entitlements
        # iPhone: Xcode's automatic signing with the team from Base.xcconfig (7V4A6JBG4R unless the optional
        # Signing.local.xcconfig overrides it).
        # The Mac keys must be on the target to beat XcodeGen's preset. Each names its configuration, so the Debug and
        # Release conditions never overlap.
        CODE_SIGN_IDENTITY: Apple Development
        # Mac Debug: ad-hoc, so a local build needs no certificate and can host the in-app tests.
        CODE_SIGN_IDENTITY[config=Debug][sdk=macosx*]: "-"
        CODE_SIGN_STYLE[config=Debug][sdk=macosx*]: Manual
        DEVELOPMENT_TEAM[config=Debug][sdk=macosx*]: ""
        # Mac Release: team-signed with 7V4A6JBG4R and a keychain access group, so the token goes to the data
        # protection keychain (audit S-M3) and archives need no manual Team pick. Base.xcconfig works out the
        # BN_MAC_RELEASE_* values from DEVELOPMENT_TEAM (ad-hoc fallback only if the team is cleared).
        CODE_SIGN_IDENTITY[config=Release][sdk=macosx*]: $(BN_MAC_RELEASE_IDENTITY)
        CODE_SIGN_STYLE[config=Release][sdk=macosx*]: $(BN_MAC_RELEASE_SIGN_STYLE)
        CODE_SIGN_ENTITLEMENTS[config=Release][sdk=macosx*]: $(BN_MAC_RELEASE_ENTITLEMENTS)
        DEVELOPMENT_TEAM[config=Release][sdk=macosx*]: 7V4A6JBG4R
    # Fail a Release archive (or any Release build) if the GitHub App client ID was not
    # substituted. Without GitHubApp.local.xcconfig the Info.plist key is empty and the
    # app shows "GitHub sign-in isn't set up in this version of the app yet." Debug is
    # left alone so in-app tests still run without that file.
    preBuildScripts:
      - name: Require GitHub App client ID in Release
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            exit 0
          fi
          if [ -z "${BN_GITHUB_CLIENT_ID}" ]; then
            echo "error: BN_GITHUB_CLIENT_ID is empty. Copy App/Config/GitHubApp.example.xcconfig to App/Config/GitHubApp.local.xcconfig and set the GitHub App client ID (a public identifier, not a secret). A Release build without it ships an app that shows GitHub sign-in is not set up." >&2
            exit 1
          fi
  BrainNotesAppTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: AppTests
    dependencies:
      - target: BrainNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itamargendelman.brainnotes.apptests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BrainNotes.app/Contents/MacOS/BrainNotes
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
  BrainNotesUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: BrainNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itamargendelman.brainnotes.uitests
        GENERATE_INFOPLIST_FILE: YES
        # XCUITest's expectation helpers are not Sendable-annotated; this target only drives the UI.
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        CODE_SIGN_STYLE[sdk=macosx*]: Manual
        DEVELOPMENT_TEAM[sdk=macosx*]: ""
schemes:
  # Everything that runs without a system permission: kit tests and the screen walk inside the app.
  BrainNotes:
    build:
      targets:
        BrainNotes: all
    test:
      gatherCoverageData: false
      environmentVariables:
        BN_DEMO: "1"
      targets:
        - package: BrainNotesKit/BrainNotesKitTests
        - name: BrainNotesAppTests
    run:
      config: Debug
  # Real clicks. On a Mac this needs automation mode, once, by an admin:
  #   sudo automationmodetool enable-automationmode-without-authentication
  BrainNotesUITests:
    build:
      targets:
        BrainNotes: all
    test:
      gatherCoverageData: false
      targets:
        - name: BrainNotesUITests
